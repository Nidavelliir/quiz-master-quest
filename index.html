/* ===== Calculs faisables de tête (jeu mobile) ===== */
const mOK=(s)=>{const t=s.replace(/π ≈ [\d,]+/,"").replace(/(\d)\s(\d{3})/g,"$1$2"),v=(t.match(/\d+/g)||[]).map(Number),a=v[0],b=v[1];
 const pr=(x,y)=>{const m=Math.min(x,y),l=Math.max(x,y);return(m<=10&&l<=15)||(m<=12&&l<=12)||(l%10==0&&l<=40&&m<=15)};
 const x5=n=>n%5==0;
 if(/périmètre d’un cercle/.test(t))return /π ≈ 3\)/.test(s);
 if(/périmètre d’un rectangle/.test(t))return a<=20&&b<=20&&a+b<=30;
 if(/périmètre d’un carré/.test(t))return a<=25;
 if(/périmètre d’un triangle équilatéral/.test(t))return a<=20;
 if(/aire d’un rectangle/.test(t))return pr(a,b);
 if(/aire d’un parallélogramme/.test(t))return pr(a,b);
 if(/aire d’un triangle/.test(t))return pr(a,b)&&(a*b)%2==0;
 if(/aire d’un carré/.test(t))return a<=12;
 if(/angles mesurent/.test(t))return x5(a)&&x5(b);
 if(/angle plat/.test(t))return x5(b);
 if(/complémentaires|supplémentaires/.test(t))return x5(a);
 return true};
const mQ=(q,a,wr,sub)=>{const o=sh([a,...wr]);return[sub||"Géométrie",q,o.map(String),o.indexOf(a)]};
(()=>{
 L.forEach((b,i)=>{L[i]=b.filter(x=>x[0]!="Géométrie"||mOK(x[1]))});
 const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[Math.floor(Math.random()*a.length)];
 const dis=(a,u,ex)=>{const s=new Set();[a+10,a-10,a+5,a-5,a*2,Math.round(a/2),a+1,a-1,...(ex||[])].forEach(d=>{if(d>0&&d!==a)s.add(d)});return sh([...s]).slice(0,3).map(d=>d+u)};
 const gens={
  cercle:()=>{const d=pk([2,4,5,6,8,10,12,15,20]);return mQ(`Quel est le périmètre d’un cercle de diamètre ${d} cm (π ≈ 3) ?`,3*d+" cm",dis(3*d," cm",[2*d,4*d]))},
  rect:(u)=>{const a=pk([3,4,5,6,7,8,9,10,12]),b=pk([2,3,4,5,6,8,10,15,20]);return mQ(`Quelle est l’aire d’un rectangle de ${a} ${u} sur ${b} ${u} ?`,a*b+" "+u+"²",dis(a*b," "+u+"²",[2*(a+b)]))},
  tri:()=>{const a=pk([4,6,8,10,12,20,30]),b=pk([2,3,4,5,6,8,10]);return mQ(`Quelle est l’aire d’un triangle de base ${a} cm et de hauteur ${b} cm ?`,a*b/2+" cm²",dis(a*b/2," cm²",[a*b]))},
  para:()=>{const a=pk([4,5,6,8,10,12]),b=pk([3,4,5,6,8,10]);return mQ(`Quelle est l’aire d’un parallélogramme de base ${a} cm et de hauteur ${b} cm ?`,a*b+" cm²",dis(a*b," cm²",[a*b/2]))},
  tri3:()=>{const a=pk([30,35,40,45,50,60,65,70,80]),b=pk([20,25,30,40,45,55,60]);return mQ(`Dans un triangle, deux angles mesurent ${a}° et ${b}°. Combien mesure le troisième ?`,(180-a-b)+"°",dis(180-a-b,"°",[a+b]))},
  sup:()=>{const a=pk([20,30,40,45,50,60,70,75,80,100,110,120]);return mQ(`Deux angles sont supplémentaires. L’un mesure ${a}°. Combien mesure l’autre ?`,(180-a)+"°",dis(180-a,"°",[90-a].filter(z=>z>0)))},
  comp:()=>{const a=pk([10,20,25,30,35,40,45,50,60,70,75,80]);return mQ(`Deux angles sont complémentaires. L’un mesure ${a}°. Combien mesure l’autre ?`,(90-a)+"°",dis(90-a,"°",[180-a]))}};
 const add=(l,g,n,u)=>{const have=new Set(L[l].map(x=>x[1]));let k=0,z=0;while(k<n&&z++<400){const q=gens[g](u);if(!have.has(q[1])){have.add(q[1]);L[l].push(q);k++}}};

/* --- modifications à distance : journal d'opérations (rien n'est écrasé : les nombres sont additionnés) --- */
const fbIsO=x=>x&&typeof x=="object"&&!Array.isArray(x),fbInc=p=>p=="coins"||/^inv\./.test(p),fbJ=x=>JSON.stringify(x===undefined?null:x);
function fbDiff(o,n){const ops=[];
 if(fbJ(o.ch||[])+fbJ(o.cw||[])!==fbJ(n.ch||[])+fbJ(n.cw||[]))ops.push({t:"ch",from:o.ch||[],fw:o.cw||[],to:n.ch||[],tw:n.cw||[]});
 const og=o.gift||{},ng=n.gift||{},gd={coins:(ng.coins||0)-(og.coins||0),n:(ng.n||0)-(og.n||0),ch:(ng.ch||[]).slice((og.ch||[]).length)},it={};let hi=0;
 for(const k of new Set([...Object.keys(og.it||{}),...Object.keys(ng.it||{})])){const d=((ng.it||{})[k]||0)-((og.it||{})[k]||0);if(d){it[k]=d;hi=1}}
 if(hi)gd.it=it;if(gd.coins>0||gd.n>0||gd.ch.length||hi)ops.push({t:"gift",v:gd});
 const walk=(a,b,path)=>{if(path.length===1&&/^(ch|cw|gift|id|__rm)$/.test(path[0]))return;
  if(fbIsO(a)&&fbIsO(b)){for(const k of new Set([...Object.keys(a),...Object.keys(b)]))walk(a[k],b[k],path.concat(k));return}
  if(fbJ(a)===fbJ(b))return;const ps=path.join(".");
  if(b===undefined){ops.push({t:"del",p:path});return}
  if(fbInc(ps)&&typeof b=="number"&&(typeof a=="number"||a===undefined)){ops.push({t:"inc",p:path,d:b-(a||0)});return}
  ops.push({t:"set",p:path,v:b})};
 for(const k of new Set([...Object.keys(o),...Object.keys(n)]))walk(o[k],n[k],[k]);return ops}
function fbApply(P,ops){for(const op of ops){
 if(op.t=="ch"){if(fbJ(P.ch||[])+fbJ(P.cw||[])===fbJ(op.from)+fbJ(op.fw)){P.ch=op.to.slice();P.cw=op.tw.slice()}else op.to.slice(op.from.length).forEach(r=>{if((P.ch||[]).length<CHMAX)addCh(P,r)})}
 else if(op.t=="gift"){const g=P.gift=P.gift||{coins:0,n:0},d=op.v;g.coins=(g.coins||0)+(d.coins||0);g.n=(g.n||0)+(d.n||0);if(d.ch&&d.ch.length){g.ch=g.ch||[];d.ch.forEach(r=>g.ch.push(r))}if(d.it){g.it=g.it||{};for(const k in d.it)g.it[k]=(g.it[k]||0)+d.it[k]}}
 else{let o=P;for(let i=0;i<op.p.length-1;i++){const k=op.p[i];if(!fbIsO(o[k]))o[k]={};o=o[k]}const k=op.p[op.p.length-1];
  if(op.t=="inc")o[k]=Math.max(0,(o[k]||0)+op.d);else if(op.t=="del")delete o[k];else o[k]=op.v}}}
